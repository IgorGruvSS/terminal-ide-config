set -g mouse on
set -g history-limit 50000
set -s extended-keys always
set -as terminal-features ',alacritty:extkeys'
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi

# Keep the status line readable with the light terminal theme.
set -g status 2
set -g status-position bottom
set -g status-style "bg=#E2E5F6,fg=#4C4F69"
set -g status-left-style "bg=#E2E5F6,fg=#4C4F69"
set -g window-status-style "bg=#E2E5F6,fg=#4C4F69"
set -g window-status-current-style "bg=#8839EF,fg=#EFF1F5,bold"
# Reserve the upper status row as a one-cell visual gap above the main bar.
set -g status-format[0] "#[bg=#E2E5F6]"
# This is tmux 3.6's default main status layout: left, window list, then right.
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
# Use one neutral Catppuccin Latte surface for the divider glyph and cell.
set -g window-style "bg=#E6E9EF"
set -g window-active-style "bg=#EFF1F5"
set -g pane-border-style "fg=#CCD0DA,bg=#CCD0DA"
set -g pane-active-border-style "fg=#CCD0DA,bg=#CCD0DA"

bind r source-file "$TERMINAL_IDE_CONFIG_DIR/tmux.conf" \; display-message "tmux config reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Direct pane navigation.
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Create a pane in the direction of the arrow.
bind -n M-S-Left split-window -hb -c "#{pane_current_path}"
bind -n M-S-Down split-window -v -c "#{pane_current_path}"
bind -n M-S-Up split-window -vb -c "#{pane_current_path}"
bind -n M-S-Right split-window -h -c "#{pane_current_path}"

# Direct window navigation and pane zoom.
bind -n C-S-Left previous-window
bind -n C-S-Right next-window
bind -n M-z resize-pane -Z

# Direct pane resize.
bind -n C-M-Left resize-pane -L 5
bind -n C-M-Down resize-pane -D 3
bind -n C-M-Up resize-pane -U 3
bind -n C-M-Right resize-pane -R 5

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
