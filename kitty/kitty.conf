# =============================================================================
# terminal-ide-config/kitty/kitty.conf
# Config mínima para workflow multi-agente
# =============================================================================

linux_display_server x11

# ── Fonte ────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font SemiBold
font_size        10.0

# ── Visual (maximalizar espaço) ──────────────────────────────────────────────
window_padding_width     2
hide_window_decorations  yes
# tab bar só aparece com 2+ tabs, e fica discreto embaixo
tab_bar_edge             bottom
tab_bar_style            powerline
tab_bar_min_tabs         2

# Borda fina entre splits pra saber onde tá cada pane
# active_border_color      #89b4fa
# inactive_border_color    #313244
window_border_width      1pt

# Dim: texto das janelas inativas fica translúcido (efeito tipo Warp dim)
inactive_text_alpha      0.55

# ── Tema ─────────────────────────────────────────────────────────────────────
include themes/terminal-black.conf

# ── Notificações (CRÍTICO pro workflow) ──────────────────────────────────────
# Notifica via KDE quando comando termina em pane não focado (após 5s)
notify_on_cmd_finish     unfocused 5.0

# Bell visual na tab quando pane pede atenção
visual_bell_duration     0.0
enable_audio_bell        no
window_alert_on_bell     yes
bell_on_tab              "🔔 "

# ── Remote control (necessário pro script dev-start) ─────────────────────────
allow_remote_control     socket-only
listen_on                unix:/tmp/kitty-dev

# ── Layouts ──────────────────────────────────────────────────────────────────
enabled_layouts          splits,stack,tall,grid

# ── Keybinds ─────────────────────────────────────────────────────────────────

# Codex multiline: make Shift+Enter behave like Ctrl+J.
map shift+enter          send_text all \u000a

# TUI apps: make Shift+Tab arrive as BackTab through kitty/tmux.
map shift+tab            send_text all \e[Z

# tmux: navegar entre panes
map alt+left             send_text all \u0002h
map alt+right            send_text all \u0002l
map alt+up               send_text all \u0002k
map alt+down             send_text all \u0002j

# tmux: zoom pane
map ctrl+shift+z         send_text all \u0002z
map ctrl+alt+m           send_text all \u0002z

# tmux: novo split
map ctrl+shift+enter     send_text all \u0002|
map ctrl+shift+o         send_text all \u0002-

# tmux: redimensionar panes
map ctrl+shift+left      send_text all \u0002H
map ctrl+shift+right     send_text all \u0002L
map ctrl+shift+up        send_text all \u0002K
map ctrl+shift+down      send_text all \u0002J
map ctrl+shift+w         send_text all \u0002x

# tmux: tabs/janelas
map ctrl+shift+t         send_text all \u0002c
map ctrl+shift+page_up   send_text all \u0002p
map ctrl+shift+page_down send_text all \u0002n
map ctrl+shift+q         send_text all \u0002&
map ctrl+shift+1         send_text all \u00021
map ctrl+shift+2         send_text all \u00022
map ctrl+shift+3         send_text all \u00023
map ctrl+shift+4         send_text all \u00024
map ctrl+shift+5         send_text all \u00025
map ctrl+shift+6         send_text all \u00026
map ctrl+shift+7         send_text all \u00027
map ctrl+shift+8         send_text all \u00028
map ctrl+shift+9         send_text all \u00029

# Scrollback grande (output de agente pode ser longo)
scrollback_lines         50000

# ── Performance ──────────────────────────────────────────────────────────────
repaint_delay            6
input_delay              1
sync_to_monitor          yes
