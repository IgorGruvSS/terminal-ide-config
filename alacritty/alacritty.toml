# Alacritty owns terminal rendering. Tmux owns panes, windows, and sessions.

[general]
import = ["themes/active.toml"]
ipc_socket = true

[font]
size = 10.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "SemiBold"

[window]
decorations = "None"
dynamic_padding = false
padding = { x = 2, y = 2 }

[scrolling]
history = 50000

[[keyboard.bindings]]
key = "Enter"
mods = "Shift"
chars = "\u001b[13;2u"
